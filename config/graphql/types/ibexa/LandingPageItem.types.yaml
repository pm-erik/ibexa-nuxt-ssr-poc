LandingPageItem:
    type: object
    inherits:
        - AbstractItem
    config:
        interfaces:
            - Item
            - Node
        fields:
            name:
                type: String
                resolve: '@=query("ItemFieldValue", value, "name", args)'
                args:
                    language: { type: RepositoryLanguage }
            description:
                type: String
                resolve: '@=query("ItemFieldValue", value, "description", args)'
                args:
                    language: { type: RepositoryLanguage }
            page:
                type: Page
                resolve: '@=query("Page", query("ItemFieldValue", value, "page", args), context)'
                args:
                    language: { type: RepositoryLanguage }
